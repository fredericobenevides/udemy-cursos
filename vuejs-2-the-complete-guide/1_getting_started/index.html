<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>VueJS</title>
    <script src="vue.js"></script>
  </head>
  <body>
    <div id="app">
      <input type="text" v-on:input="changeTitle">
      <p>{{ title }}</p>
    </div>
    <script charset="utf-8">
      new Vue({
        el: '#app',
        data: {
          title: 'Hello World!'
        },
        methods: {
          changeTitle: function(event) {
            this.title = event.target.value
          }
        }
      });
    </script>
  </body>
</html>
