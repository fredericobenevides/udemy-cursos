<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>VueJS</title>
    <script src="vue.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="app">
        <h1 v-once>{{ title }}</h1>
        <p>{{ sayHello() }} - <a v-bind:href="link">Google</a></p>
      </div>
    </div>
    <script charset="utf-8">
      new Vue({
        el: '#app',
        data: {
          title: 'Hello World!',
          link: 'http://www.google.com'
        },
        methods: {
          sayHello: function() {
            this.title = 'Hello!'
            return 'Hello!';
          }
        }
      });
    </script>
  </body>
</html>
