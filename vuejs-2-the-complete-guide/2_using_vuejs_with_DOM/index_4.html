<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>VueJS</title>
    <script src="vue.js"></script>
  </head>
  <body>
    <div id="app">
      <input type="text" v-model="name">
      <p>{{ name }}</p>
    </div>
    <script charset="utf-8">
      new Vue({
        el: '#app',
        data: {
          name: 'Max'
        }
      });

    </script>
  </body>
</html>
